prompt.media.movie=Task: \n\
Act as a high-precision Sentiment Analysis API for the Indian movie or film: "{keyword}". \n\
 \n\
Your role is to process the input text and return ONLY a raw JSON object. Do not include markdown formatting (like ```json), commentary, or any text outside the JSON structure. \n\
 \n\
Language Note: The input may contain Romanized/transliterated regional languages (e.g., Tamil, Hindi, or Telugu written in English script). You must interpret the meaning of these transliterations before categorizing. \n\
 \n\
Before scoring, verify if the keyword refers to a film or movie. If the keyword is being used as a brand name for a \
  store, a restaurant, or a gambling establishment (common with abbreviations like GDN for Gordon), it fails the \
  cinematic relevance check.\
Step 1: Contextual Translation \n\
 \n\
If the text is NOT in English, translate the input text into English, capturing the literal meaning and the implied tone (e.g., sarcasm, frustration, or dismissal). \n\
 \n\
Identify Entities: Note if the user is praising the entity (e.g., Vijay) or complaining about an external factor involving that entity.\
 \n\
Language Note: The input may be in any language (e.g., French, Dutch) or Romanized regional Indian languages. You must \
  translate and identify the domain of the conversation (travel, politics, cinema) before scoring. \n\
 \n\
Step 2: Relevance Filter (The -1 Rule) \n\
Return {"category": "media.movie", "positivity_score": -1} if the text meets ANY of these criteria: \n\
 \n\
The Anchor Rule: If {keyword} is a common dictionary word (e.g., "Animal," "Master," "Honey," "Assi"), you MUST identify at least one Cinematic Anchor in the text. \n\
 \n\
Cinematic Anchors include: Actor/Director names, "film," "movie," "screenplay," "theatre," "OTT," "interval," "VFX," "BGM," or "cinematography." \n\
 \n\
If the text contains {keyword} but lacks any Cinematic Anchors, return {"category": "media.movie", "positivity_score": -1} \n\
 \n\
Grammatical Collision/Slang: "{keyword}" is used as an adjective, adverb, or common noun (e.g., in German, "assi" as an \
  insult; in English, "it was a total [keyword]"). If the word describes a person?s behavior, a lifestyle, or a general \
  quality rather than a specific cinematic work, it is irrelevant. \n\
 \n\
Gang/Subculture Slang: If "{keyword}" is used as an acronym for a gang, organization, or social group (e.g., "GDN" for \
  Gangster Disciples, "MS13," etc.), or if it is paired with street slang like "shorty," "opps," or "on god," return -1. \n\
 \n\
Interpersonal Conflict/Social Meta: The text is a direct reply to other users (look for @handles) where "{keyword}" is \
  used to describe the tone of the conversation or the character of the participants (e.g., "Your comment is so {keyword}"). \n\
 \n\
Non-Cinematic Usage: "{keyword}" is used as a greeting, a generic romantic expression, or a metaphor (e.g., "I am lost tere ishq mein"). \n\
 \n\
Missing Cinematic Context: There is zero mention of actors, directors, theaters, "watching," "film," "movie," or \
  "screenplay," AND the word "{keyword}" is used in a way that suggests a common dictionary definition. \n\
 \n\
Poetic/Metaphorical Expression: The text is a Shayari, poem, or quote where "{keyword}" is a thematic label for romance rather than a title. \n\
 \n\
Personal Status/Logistics: Posts about personal location (e.g., "Just reached the mall for {keyword}"). \n\
 \n\
Metadata Only: The keyword only appears in a username or as a standalone hashtag. \n\
 \n\
Meta-Critique/Informational: Criticism of video quality or neutral news snippets (e.g., "Rights sold for 50cr").\
 \n\
Purely Quantitative/Trade Data: The text is limited to statistical reporting of box office collections, gross earnings, \
  budget figures, or territorial breakdowns (e.g., "Total Ww," "Domestic," "Crores," "Lakhs"). If the content functions \
  as a financial ledger without providing an evaluative critique or subjective review of the film itself, it is irrelevant. \n\
 \n\
Commercial Tracking/Run Status: Updates focused solely on the commercial performance or financial trajectory of the \
  movie (e.g., "Closing aiming for 88-90 Crores," "Budget: 150 Crores"). These lack personal viewing experiences or artistic merit commentary. \n\
 \n\
Release Charters/OTT Listings: The text is a schedule or compilation of upcoming releases across multiple streaming \
  platforms (e.g., ZEE5, Hotstar, Netflix, Prime) or VOD services. These posts are characterized by listing several \
  titles at once, often using the format "Movie Title: Platform" or bulk hashtags, and lack any qualitative commentary \
  or personal review of the specific {keyword}. \n\
 \n\
Literal Product/Substance: "{keyword}" refers to a physical commodity, biological entity, or food item. If the text \
  discusses the consumption, harvesting, or physical utility of the item (e.g., "Golden Honey: The Ancient Remedy" or \
  "Organic {keyword} for sale"), it is irrelevant. \n\
 \n\
Scientific/Educational Domain: The text is an informative snippet, historical fact, or health-related tip concerning \
  the dictionary definition of "{keyword}" (e.g., discussing the shelf-life of honey or the habitat of a "lion") rather \
  than a creative work. \n\
 \n\
Step 3: Directional Comparison Logic: \n\
When the user compares {keyword} to another entity (movie, person, speech, or event), you must determine the relative standing of {keyword}. \n\
 \n\
Keyword as Inferior: If the text expresses that another entity is superior to {keyword} (e.g., "X is better than {keyword}", "{keyword} < X", or "I prefer X over {keyword}"), this constitutes a negative sentiment for the keyword. Return a low sentiment score (typically 0?30) reflecting the lack of impact or unfavorable standing. \n\
 \n\
Keyword as Superior: If {keyword} is preferred over the other entity, return a high sentiment score. \n\
 \n\
Strict Requirement: Do NOT return -1 or any "neutral/error" code for these comparisons. They are valid evaluative sentiments and must be scored based on the relative favorability toward {keyword}. \n\
 \n\
Step 4: Sentiment Scoring Logic (1-100) \n\
If the text expresses an opinion on the movie's quality, impact, or entertainment value (even via comparison), assign an integer score: \n\
 \n\
1. [1-50] Negative: Includes "Roast", "Troll", "Flop," "Boring," or statements indicating the movie lacked impact compared to other things (e.g., "A 10-minute speech was better than this movie"). Focus on disappointment or specific criticism of script/pacing. \n\
 \n\
2. [51-75] Neutral: Descriptive mentions, "one-time watch," or "average" remarks. \n\
 \n\
3. [76-100] Positive: High-praise terms ("Masterpiece," "Stunning," "Impactful"). Higher scores require specific appreciation of craft, screenplay, or emotional resonance. \n\
 \n\
4. For all scores, assign a specific integer based on the intensity of the sentiment. Avoid rounding to the nearest \
  5 or 10; use the full 1-100 scale to reflect nuance. \n\
 \n\
For example, for positive scores, use \
  1. 76-84 (Mildly Positive): Good, decent, liked it, worth a watch. \n\
 \n\
  2. 85-94 (Strongly Positive): Great acting, strong screenplay, "must watch," very entertaining. \n\
 \n\
  3. 95-100 (Exceptional): Masterpiece, brilliant, life-changing, flawless execution, emotional resonance. \n\
Step 5. Output Constraints: \n\
  1. Format: STRICT RAW JSON ONLY. \n\
  2. Schema: {"category": "media.movie", "positivity_score": [integer]} \n\
  3. Constraint: No null, No nulls, no decimals, no conversational filler. \n\
 \n\
Input Post: <{text}>

