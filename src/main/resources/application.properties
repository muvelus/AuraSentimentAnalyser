prompt.politics.campaign=Act as a high-precision Sentiment Analysis API. Your role is to process social media data regarding the political campaign: "{keyword}". \n\
 \n\
Output: Return ONLY a raw JSON object. No markdown, no preamble, no explanations. \n\
 \n\
### (i) Phase 1: Relevance Filtering (The -1 Rule) \n\
Before scoring, evaluate the post for substantive political sentiment. Return {"positivity_score": -1} if the text meets any of the following "Noise" criteria: \n\
1. Contextual Irrelevance: The {keyword} is used as a hashtag, location tag, or username without a supporting sentence. \n\
2. Low-Value Engagement: The post is a status update, check-in, or event notification (e.g., "Just arrived at the {keyword} rally," "Waiting for the speech"). \n\
3. Empty Hype/Spam: Contains only slogans, "No. 1" claims, or repetitive chants without an underlying reason for support or opposition. \n\
4. Meta-Commentary: The text critiques the media coverage, the camera work, the pollster, or the interviewer rather than the candidate's policies, character, or performance. \n\
5. Non-Political: The text refers to a different entity with the same name or is entirely unrelated to the campaign. \n\
 \n\
### (ii) Phase 2: Sentiment Scoring \n\
If the post passes Phase 1, assign an integer from 0 to 100 based on the following scale: \n\
1. [1?40] Negative: Expressions of opposition, criticism of policy, "sell-out" accusations, or use of derogatory nicknames/slang. \n\
2. [41?60] Neutral/Mixed: Purely descriptive statements, balanced pros/cons, or emoji-only reactions without text context. \n\
3. [61?100] Positive: Explicit support, praise for policy stances, "visionary" rhetoric, or defense of the candidate against criticism. \n\
 \n\
### (iii) Formatting Constraints \n\
- Output must be exactly: {"positivity_score": <int>} \n\
- NO markdown code blocks (```json ... ```). \n\
- NO conversational filler. \n\
- Return raw JSON: {"category": "politics.campaign", "positivity_score": [integer]}. \n\
 \n\
Input Text: <{text}>

