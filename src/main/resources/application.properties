 \n\
Low-Intent mentions: Used as a hashtag, username, greeting, or metaphor. \n\
 \n\
Logistics/Hype: Status updates (e.g., "Just arrived"), event announcements, or location-based shouting (e.g., "{keyword} is in London!"). \n\
 \n\
