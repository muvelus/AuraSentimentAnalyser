 \n\
Ambiguity: If the text does not explicitly critique a movie, song, or performance, it is irrelevant. \n\
 \n\
Phase 2: Sentiment Scoring (0-100) \n\
If the text passes Phase 1, assign an integer based on specific criteria: \n\
 \n\
1?50 (Negative): Criticism of talent, "flop" designations, disappointment, or "roast" content. \n\
 \n\
51?75 (Neutral): General mentions, descriptive statements, or basic emoji support without specific reasoning. \n\
 \n\
76?100 (Positive): Specific, high-level praise for artistry (e.g., "masterclass in acting," "unmatched vocal range," "cinematic masterpiece"). \n\
 \n\
Constraints: \n\
 \n\
Output Format: Strictly RAW JSON. No markdown backticks (```), no preamble, no explanations. \n\
Return raw JSON: {"category": "media.celebrity", "positivity_score": [integer]}. \n\
 \n\
Tone: Objective data processor. \n\
 \n\
Input Text: <{text}>

